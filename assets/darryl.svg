<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 90%, 100% { opacity: 1; } 93%, 97% { opacity: 0; } }
    @keyframes badge { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.25; } }
    .bob { animation: bob 1.35s steps(1, end) infinite 0.25s; }
    .blink { animation: blink 3.8s steps(1, end) infinite 0.9s; }
    .badge { animation: badge 1.4s steps(1, end) infinite; }
  </style>
  <rect x="0" y="0" width="16" height="16" fill="#1e3a8a"/>
  <rect x="2" y="10" width="12" height="6" fill="#2563eb"/><rect x="5" y="10" width="6" height="1" fill="#1e3a8a"/>
  <rect x="9" y="12" width="3" height="1" fill="#f8fafc"/>
  <rect x="11" y="12" width="1" height="1" fill="#38bdf8" class="badge"/>
  <g class="bob">
    <rect x="4" y="2" width="8" height="2" fill="#09090b"/><rect x="3" y="3" width="2" height="3" fill="#09090b"/><rect x="11" y="3" width="2" height="3" fill="#09090b"/>
    <rect x="4" y="4" width="8" height="6" fill="#8d5524"/>
    <g class="blink">
      <rect x="5" y="6" width="1" height="1" fill="#09090b"/><rect x="10" y="6" width="1" height="1" fill="#09090b"/>
    </g>
    <rect x="6" y="8" width="4" height="2" fill="#09090b"/><rect x="7" y="8" width="2" height="1" fill="#f8fafc"/>
  </g>
</svg>
