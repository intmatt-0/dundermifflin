<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 90%, 100% { opacity: 1; } 93%, 97% { opacity: 0; } }
    @keyframes sip { 0%, 65%, 100% { transform: translateY(0px); } 75%, 90% { transform: translateY(-1px); } }
    @keyframes steam1 { 0%, 100% { opacity: 0.85; transform: translateY(0px); } 50% { opacity: 0.2; transform: translateY(-1px); } }
    @keyframes steam2 { 0%, 100% { opacity: 0.2; transform: translateY(-1px); } 50% { opacity: 0.85; transform: translateY(0px); } }
    @keyframes sigh { 0%, 100% { opacity: 0.85; transform: translateY(0px); } 50% { opacity: 0.2; transform: translateY(1px); } }
    @keyframes look { 0%, 70%, 100% { transform: translateY(0px); } 78%, 92% { transform: translateY(-1px); } }
    @keyframes note { 0%, 100% { opacity: 0.95; transform: translateY(0px); } 50% { opacity: 0.25; transform: translateY(-1px); } }
    @keyframes glint { 0%, 72%, 100% { opacity: 0; transform: translateX(0px); } 78% { opacity: 0.95; transform: translateX(0px); } 86% { opacity: 0.95; transform: translateX(1px); } 92% { opacity: 0; transform: translateX(1px); } }
    @keyframes badge { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.25; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .bob { animation: bob 1.6s steps(1, end) infinite; }
    .blink { animation: blink 3.5s steps(1, end) infinite 0.5s; }
    .mug { animation: sip 2.8s steps(1, end) infinite; }
    .s1 { animation: steam1 1.4s steps(1, end) infinite; }
    .s2 { animation: steam2 1.4s steps(1, end) infinite; }
    .sigh { animation: sigh 1.8s steps(1, end) infinite; }
    .brows { animation: look 3.4s steps(1, end) infinite; }
    .note { animation: note 1.15s steps(1, end) infinite; }
    .glint { animation: glint 3.0s steps(1, end) infinite; }
    .badge { animation: badge 1.4s steps(1, end) infinite; }
    .led { animation: pulse 1.2s steps(2, end) infinite; }
    .txt { font-family: 'Courier New', Consolas, monospace; font-weight: bold; }
</style>

