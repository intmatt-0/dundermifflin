<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 90%, 100% { opacity: 1; } 93%, 97% { opacity: 0; } }
    @keyframes sip { 0%, 65%, 100% { transform: translateY(0px); } 75%, 90% { transform: translateY(-1px); } }
    @keyframes steam1 { 0%, 100% { opacity: 0.85; transform: translateY(0px); } 50% { opacity: 0.2; transform: translateY(-1px); } }
    @keyframes steam2 { 0%, 100% { opacity: 0.2; transform: translateY(-1px); } 50% { opacity: 0.85; transform: translateY(0px); } }
    .bob { animation: bob 1.6s steps(1, end) infinite; }
    .blink { animation: blink 3.6s steps(1, end) infinite 0.4s; }
    .mug { animation: sip 2.8s steps(1, end) infinite; }
    .s1 { animation: steam1 1.4s steps(1, end) infinite; }
    .s2 { animation: steam2 1.4s steps(1, end) infinite; }
  </style>
  <rect x="0" y="0" width="16" height="16" fill="#1e293b"/>
  <rect x="2" y="10" width="12" height="6" fill="#27272a"/><rect x="6" y="10" width="4" height="6" fill="#f8fafc"/>
  <rect x="7" y="10" width="2" height="1" fill="#b91c1c"/><rect x="7" y="11" width="2" height="4" fill="#ef4444"/>
  <g class="bob">
    <rect x="4" y="2" width="8" height="2" fill="#18181b"/><rect x="3" y="3" width="2" height="3" fill="#18181b"/><rect x="11" y="3" width="2" height="2" fill="#18181b"/>
    <rect x="4" y="4" width="8" height="6" fill="#f5c6a5"/><rect x="5" y="3" width="6" height="1" fill="#f5c6a5"/>
    <rect x="5" y="5" width="2" height="1" fill="#27272a"/><rect x="9" y="5" width="2" height="1" fill="#27272a"/>
    <g class="blink">
      <rect x="5" y="6" width="1" height="1" fill="#09090b"/><rect x="10" y="6" width="1" height="1" fill="#09090b"/>
    </g>
    <rect x="6" y="8" width="4" height="1" fill="#ffffff"/><rect x="7" y="9" width="2" height="1" fill="#be123c"/>
  </g>
  <rect x="12" y="9" width="1" height="1" fill="#93c5fd" class="s1"/>
  <rect x="13" y="8" width="1" height="1" fill="#e2e8f0" class="s2"/>
  <g class="mug">
    <rect x="11" y="11" width="3" height="3" fill="#f8fafc"/><rect x="14" y="12" width="1" height="1" fill="#cbd5e1"/><rect x="12" y="12" width="1" height="1" fill="#2563eb"/>
  </g>
</svg>
