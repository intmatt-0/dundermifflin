<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 90%, 100% { opacity: 1; } 93%, 97% { opacity: 0; } }
    @keyframes sigh { 0%, 100% { opacity: 0.85; transform: translateY(0px); } 50% { opacity: 0.2; transform: translateY(1px); } }
    .bob { animation: bob 2.4s steps(1, end) infinite 0.3s; }
    .blink { animation: blink 4.2s steps(1, end) infinite 1.1s; }
    .sigh { animation: sigh 1.8s steps(1, end) infinite; }
  </style>
  <rect x="0" y="0" width="16" height="16" fill="#292524"/>
  <rect x="2" y="10" width="12" height="6" fill="#a89070"/><rect x="6" y="10" width="4" height="6" fill="#fef3c7"/>
  <rect x="7" y="10" width="2" height="5" fill="#78350f"/>
  <g class="bob">
    <rect x="4" y="2" width="8" height="1" fill="#b48a5a"/><rect x="3" y="3" width="2" height="3" fill="#b48a5a"/><rect x="11" y="3" width="2" height="3" fill="#b48a5a"/>
    <rect x="5" y="3" width="6" height="1" fill="#f3c6a5"/><rect x="4" y="4" width="8" height="6" fill="#f3c6a5"/>
    <rect x="5" y="5" width="2" height="1" fill="#9a7248"/><rect x="9" y="5" width="2" height="1" fill="#9a7248"/>
    <g class="blink">
      <rect x="5" y="6" width="1" height="1" fill="#292524"/><rect x="10" y="6" width="1" height="1" fill="#292524"/>
    </g>
    <rect x="6" y="8" width="4" height="1" fill="#a16247"/>
    <rect x="12" y="4" width="1" height="2" fill="#38bdf8" class="sigh"/>
  </g>
</svg>
