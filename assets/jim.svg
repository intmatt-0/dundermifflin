<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1px); } }
    @keyframes blink { 0%, 90%, 100% { opacity: 1; } 93%, 97% { opacity: 0; } }
    @keyframes look { 0%, 70%, 100% { transform: translateY(0px); } 78%, 92% { transform: translateY(-1px); } }
    .bob { animation: bob 1.8s steps(1, end) infinite 0.6s; }
    .blink { animation: blink 3.2s steps(1, end) infinite 0.8s; }
    .brows { animation: look 3.4s steps(1, end) infinite; }
  </style>
  <rect x="0" y="0" width="16" height="16" fill="#172554"/>
  <rect x="2" y="10" width="12" height="6" fill="#f8fafc"/><rect x="2" y="11" width="2" height="5" fill="#e2e8f0"/><rect x="12" y="11" width="2" height="5" fill="#e2e8f0"/>
  <rect x="7" y="10" width="2" height="5" fill="#1e3a8a"/><rect x="7" y="11" width="2" height="1" fill="#3b82f6"/>
  <g class="bob">
    <rect x="4" y="2" width="8" height="2" fill="#4a3222"/><rect x="3" y="3" width="10" height="2" fill="#4a3222"/>
    <rect x="3" y="5" width="1" height="2" fill="#4a3222"/><rect x="6" y="4" width="3" height="1" fill="#3b2619"/><rect x="12" y="5" width="1" height="2" fill="#4a3222"/>
    <rect x="4" y="4" width="2" height="1" fill="#f5c6a5"/><rect x="9" y="4" width="3" height="1" fill="#f5c6a5"/><rect x="4" y="5" width="8" height="5" fill="#f5c6a5"/>
    <g class="brows">
      <rect x="5" y="5" width="2" height="1" fill="#3b2619"/><rect x="9" y="5" width="2" height="1" fill="#3b2619"/>
    </g>
    <g class="blink">
      <rect x="5" y="6" width="1" height="1" fill="#18181b"/><rect x="10" y="6" width="1" height="1" fill="#18181b"/>
    </g>
    <rect x="6" y="8" width="3" height="1" fill="#9a5b42"/>
    <rect x="9" y="7" width="1" height="1" fill="#9a5b42" class="brows"/>
  </g>
</svg>
