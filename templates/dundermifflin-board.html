    body, button, code, span, p, h2, li, div {
      font-family: 'DunderPixel', 'Courier New', monospace !important;
      letter-spacing: 0.04em;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    .pixel-box {
      border-radius: 0px !important;
      box-shadow: 3px 3px 0px 0px var(--border);
      transition: transform 0.15s steps(2, end), box-shadow 0.15s steps(2, end), border-color 0.15s ease;
    }
    .agent-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px 0px var(--primary);
    }
    .agent-card:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px 0px var(--border);
    }
    .filter-btn {
      transition: transform 0.12s steps(2, end), box-shadow 0.12s steps(2, end), background-color 0.15s ease;
      box-shadow: 2px 2px 0px 0px var(--border);
    }
    .filter-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px 0px var(--primary);
    }
    .filter-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px 0px var(--border);
    }
    @keyframes pixelMarch {
      0% { background-position: 0 0; }
      100% { background-position: 16px 0; }
    }
    .pixel-bar {
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 6px,
        rgba(0, 0, 0, 0.28) 6px,
        rgba(0, 0, 0, 0.28) 8px
      );
      background-size: 16px 100%;
      animation: pixelMarch 0.9s steps(4, end) infinite;
      position: relative;
      overflow: hidden;
    }
    @keyframes barSweep {
      0%, 65% { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }
    .pixel-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 35%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.32), transparent);
      animation: barSweep 3.2s steps(8, end) infinite;
    }
    @keyframes cardCascade {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .card-enter {
      animation: cardCascade 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .pixel-led {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: currentColor;
      animation: ledPulse 1.4s steps(2, end) infinite;
    }
    .pixel-led-fast {
      animation-duration: 0.55s;
    }
    /* Accordion Drawer Flow */
    .task-drawer {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, padding-top 0.2s ease;
    }
    .task-drawer.collapsed {
      grid-template-rows: 0fr;
      opacity: 0;

                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="font-bold text-sm text-[var(--foreground)]">${agent.name}</span>
                    <code class="text-xs px-1.5 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] font-semibold">${agent.slash}</code>
                  </div>
                  <p class="text-xs font-medium text-[var(--muted-foreground)]">${agent.role}</p>
                </div>
              </div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-none border inline-flex items-center gap-1.5 ${statusBadgeStyle(agent.status)}">
                <span class="pixel-led ${isFastStatus(agent.status) ? 'pixel-led-fast' : ''}"></span>
                <span>${agent.status}</span>
              </span>
            </div>

            <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${agent.currentTask}</p>
          </div>

          <div class="space-y-1.5 pt-1 border-t border-[var(--border)]">
            <div class="flex items-center justify-between text-xs">
              <code class="text-[var(--muted-foreground)]">${agent.blueprint}</code>
              <span class="font-bold text-[var(--foreground)]">${agent.progress}%</span>
            </div>
            <div class="w-full h-2 bg-[var(--card)] border border-[var(--border)] rounded-none overflow-hidden">
              <div class="agent-bar h-full ${barColor(agent.status)} pixel-bar transition-all duration-500 ease-out" style="width: 0%" data-target="${agent.progress}%"></div>
            </div>
            <div class="task-drawer pt-1.5">
              <ul class="task-drawer-inner space-y-1">
                ${tasksHtml}
              </ul>
            </div>
          </div>
        `;

        card.addEventListener("click", () => {
          const drawer = card.querySelector(".task-drawer");
          drawer.classList.toggle("collapsed");
        });

        grid.appendChild(card);
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          grid.querySelectorAll(".agent-bar").forEach(bar => {
            bar.style.width = bar.getAttribute("data-target");
          });
        });
      });
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentFilter = btn.getAttribute("data-filter");
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.className = "filter-btn text-xs font-medium px-2.5 py-1 rounded-none border border-[var(--border)] bg-[var(--background)] text-[var(--muted-foreground)]";
        });
        btn.className = "filter-btn text-xs font-medium px-2.5 py-1 rounded-none border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)]";
        renderBoard();
      });
    });

    renderBoard();
  </script>
</body>
</html>
